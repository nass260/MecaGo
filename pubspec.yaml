name: mecago
description: "Application premium d'entretien et diagnostic automobile assisté par IA."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  go_router: ^13.2.0
  sqflite: ^2.3.0
  sqflite_common_ffi_web: ^0.4.2
  path: ^1.8.3
  path_provider: ^2.1.0
  flutter_local_notifications: ^16.3.2
  pdf: ^3.10.7
  printing: ^5.12.0
  url_launcher: ^6.2.4
  connectivity_plus: ^5.0.2
  http: ^1.1.0
  intl: ^0.18.1
  uuid: ^4.3.3
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/